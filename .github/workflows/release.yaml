name: Tag New Version and Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag-and-release:
    uses: George-Ogden/actions/.github/workflows/python-release.yaml@v4.6.3
    with:
      validation-code: "from debug import dbg; assert callable(dbg)"
      python-version: "3.14"
