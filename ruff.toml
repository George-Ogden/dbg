line-length = 100

[format]
quote-style = "double"
indent-style = "space"

[lint]
extend-ignore = ["ANN401","B028","C408","E501", "F811", "N812", "PLC0414", "PT011", "PT012", "PT013", "PYI024", "PYI041", "RET504", "S", "SIM118", "TRY"]
extend-unfixable = ["B905", "B911", "B912", "PT006"]
preview = true

[lint.isort]
force-sort-within-sections = true
split-on-trailing-comma = false

[lint.flake8-pytest-style]
parametrize-names-type = "csv"
